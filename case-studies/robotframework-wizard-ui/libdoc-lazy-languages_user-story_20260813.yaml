      source: "llm_domain_knowledge, corroborated at src/robot/conf/settings.py:531"
      type: domain-best-practice
      confidence: SUGGESTED
      aspect_id: a1
      aspect: "Root cause -- TypeConverter.languages eager (vs. lazy) construction"
      summary: >
        General principle: an expensive-to-construct, doc-time-irrelevant
        object should be lazily initialized when most call sites never read
        it. Corroborated directly in this repo: the *execution* path
        constructs exactly one `Languages(self['Language'])` per run
        (conf/settings.py:531, `RobotSettings.languages` property), so
        laziness costs execution nothing -- it is purely Libdoc's
        None-default, once-per-argument-type path that pays the eager
        construction's cost for no benefit.
