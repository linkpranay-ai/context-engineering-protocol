  summary:
    - "What-L3: `TypeConverter.__init__` (running/arguments/typeconverters.py:54) reads `self.languages = languages or Languages()` -- eager, unconditional construction whenever the caller passes no `languages` argument. `graphify explain \"TypeConverter\"` confirms this is a high-traffic node: degree 44, with 25 converter subclasses (Enum/String/Boolean/Integer/Float/Decimal/Bytes/ByteArray/DateTime/Date/TimeDelta/Path/None/List/Tuple/TypedDict/Dictionary/Set/FrozenSet/Union/Literal/Custom) inheriting from it."
    - "What-L3: Libdoc never passes `languages` to `TypeConverter.converter_for()`. Two real, confirmed call sites: `TypeDoc.for_type()` (libdocpkg/datatypes.py:50, called once per documented type) and `_get_type_docs()` (libdocpkg/robotbuilder.py:68, called once per keyword/init). `graphify affected \".converter_for()\" --depth 2` surfaces both directly, plus `TypeConverter.convert()`'s own runtime caller (typeinfo.py:266) for contrast -- confirming Libdoc's doc-time path and the execution engine's run-time path share the exact same constructor."
    - "What-L3 (real upstream fix, verified against github.com/robotframework/robotframework): commit 6d0c6a4630bf6b906253c802e2bf5b266a1a8893, 'Initiallize `TypeConverter.languages` only when needed,' 2024-11-05, 'Fixes #5254' -- makes `.languages` a lazy-initialized property instead of an eager `__init__` assignment. Commit message reports 'roughly 50% performance enhancement with really big libraries.' This commit postdates the pinned v7.1.1 clone (2024-10-19), so the eager-construction bug is still live, reproducible source in this repo -- confirmed directly: `grep -n \"self.languages\" src/robot/running/arguments/typeconverters.py` -> line 54, unchanged from the pre-fix state the issue describes."
    - "What-L2 (autoscaffolded, this case study's own Phase B output): docs/requirements/libdocpkg/CONTEXT.md confirms libdocpkg (Tier 3 leaf) depends on `running` (where TypeConverter lives); docs/requirements/running/CONTEXT.md confirms running (Tier 2) depends on `conf` (where Languages lives) -- both real, graph-derived dependency edges corroborating the real call chain libdocpkg -> running.TypeConverter -> conf.Languages found in What-L3, though neither file mentions performance or this specific bug (see decisions_log -- this is expected of module-granularity Phase B content, not a gap in scaffolding quality)."
    - "No conflicts detected between What-L3 (source) and the external issue-tracker/commit evidence -- both describe the identical mechanism (eager `Languages()` in `TypeConverter.__init__`, no `languages` passed from Libdoc)."
