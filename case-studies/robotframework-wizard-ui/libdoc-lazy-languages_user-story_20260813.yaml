context_package:
  id: libdoc-lazy-languages_user-story_20260813
  task: >
    Write functional user stories for fixing Robot Framework's Libdoc
    performance degradation on large keyword libraries (real, closed issue
    #5254, "Libdoc performance degradation starting RF 6.0"):
    `TypeConverter.__init__` (`src/robot/running/arguments/typeconverters.py`)
    eagerly constructs a new `Languages()` instance on every call even when
    the caller never reads `.languages`, and Libdoc's doc-generation path
    (`TypeDoc.for_type()` in `libdocpkg/datatypes.py`, `_get_type_docs()` in
    `libdocpkg/robotbuilder.py`) calls `TypeConverter.converter_for()` once
    per documented argument type without ever passing `languages` — so a
    library with thousands of keywords/arguments instantiates `Languages()`
    thousands of times purely for documentation generation, roughly doubling
    Libdoc's run time. Real upstream fix: commit
    `6d0c6a4630bf6b906253c802e2bf5b266a1a8893` ("Initiallize
    `TypeConverter.languages` only when needed", 2024-11-05, "Fixes #5254"),
    reporting "roughly 50% performance enhancement with really big
    libraries" — this fix postdates the pinned `v7.1.1` clone this case
    study uses, so the bug is still live, reproducible source in this repo.
  scope:
    feature: "TypeConverter.languages eager-vs-lazy construction and Libdoc's call path into it"
    task_type: user-story
    new_or_existing: existing
    out_of_scope: >
      The `Languages` class's own internal cost (why constructing it is slow
      in the first place — the real fix's commit message explicitly flags
      this as a separate, uninvestigated question); the companion same-day
      commit `9d93b7d89bd971a03e4b195db2412f1e5f30e44d` ("Make initializing
      `Languages` without arguments faster") which optimizes a different,
      complementary path; any change to execution-time behavior (the
      execution engine always passes a real `Languages` instance already,
      so this fix is Libdoc-only in effect).
