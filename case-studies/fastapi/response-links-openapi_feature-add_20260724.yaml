context_package:
  id: response-links-openapi_feature-add_20260724
  task: >
    Add a first-class `links` parameter to the path-operation decorators
    (`@app.get`, `@app.post`, `APIRouter` methods, etc.), so a developer can
    declare OpenAPI Link Objects (RFC 6733-style design-time links between a
    response and a follow-up operation) the same direct way they already
    declare OpenAPI callbacks via the existing `callbacks=` parameter —
    instead of only being reachable through the generic `responses=` raw-dict
    override or `openapi_extra`.
  scope:
    feature: OpenAPI response Link Object support on path operations
    task_type: feature-add
    new_or_existing: existing
    out_of_scope: >
      Any change to the already-shipped `callbacks=` parameter or its build
      path; Starlette's routing layer; the `openapi_extra` escape hatch
      itself (stays available regardless); adding runtime link-following
      behavior (OpenAPI Link Objects are design-time/documentation metadata
      only, per the spec — see aspect a4).
  aspects:
    - aspect_id: a1
      name: Baseline — Callback Object already has full first-class parameter support (working exemplar)
      what_l3_covered: true
      what_l2_covered: true
      what_l1_covered: true
    - aspect_id: a2
      name: Gap — Link Object has no dedicated parameter, only reachable via responses=/openapi_extra
