    - "What-L3: `callbacks=` is a fully-wired first-class parameter — declared on every path-operation decorator (fastapi/routing.py, fastapi/applications.py), threaded onto `APIRoute.callbacks` (fastapi/routing.py:2517), and expanded into nested OpenAPI Path/Operation objects inside `get_openapi_path()` (fastapi/openapi/utils.py:323-339)."
    - "What-L3: `links` (an OpenAPI Response Object field, same family as `callbacks`) has zero dedicated parameter anywhere in fastapi/routing.py or fastapi/applications.py — the only way to set it today is the generic `responses={200: {\"links\": {...}}}` raw-dict override, merged via `deep_dict_update()` at fastapi/openapi/utils.py:410-453, or `openapi_extra`."
    - "What-L3: the real integration point for a first-class `links=` parameter is that same block (fastapi/openapi/utils.py:410-453) — a built links dict would need to `deep_dict_update()` into `openapi_response` before the user's own `responses=` override is applied, so a manual override can still take precedence, mirroring how `callbacks=` already composes with `openapi_extra`."
    - "What-L1: OpenAPI 3.1.0's Link Object (`specs/external/openapi-3.1.0.md` §\"Link Object\", line 2026) is explicitly a design-time/documentation construct with no runtime-invocation guarantee — bounding the fix to declarative metadata generation, not runtime link-following behavior."
