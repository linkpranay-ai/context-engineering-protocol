context_package:
  id: trim-prefix-whitespace_user-story_20260801
  task: >
    Write functional user stories for ripgrep's `--trim`/`--no-trim` flag —
    stripping leading ASCII whitespace from each printed matching line — and
    for its execution-order relationship with `-M/--max-columns` truncation
    (trim must run before max-columns windowing, per issue #917 introducing
    the flag and PR #2458 fixing an ordering bug between the two).
  scope:
    feature: "--trim flag: prefix-whitespace trimming and its ordering relative to --max-columns"
    task_type: user-story
    new_or_existing: existing
    out_of_scope: >
      CRLF/line-terminator handling and the `--replace`/Replacer subsystem
      (a separate, already-covered feature — see the
      ripgrep-crlf-replace-terminator case study); `--max-columns`'s own
      truncation/preview logic itself (only its ordering relative to trim is
      in scope); any change to trim's default-off behavior.
  aspects:
