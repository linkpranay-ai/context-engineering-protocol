      source: "crates/printer/src/standard.rs:1053-1054,1137-1138,1198-1201,1231-1232"
      type: implementation
      confidence: EXTRACTED
      aspect_id: a2
      aspect: Trim execution order relative to --max-columns windowing
      summary: >
        Every call site pairs `self.trim_ascii_prefix(bytes, &mut line)`
        immediately followed by `self.exceeds_max_columns(&bytes[line])` (or
        the free-function variant `trim_ascii_prefix(...)` at L1198 followed
        by `self.exceeds_max_columns(line)` at L1201) — trim always runs
        first, mutating the `line: Match` range in place before the
        max-columns length check reads it. This is the exact ordering
        CHANGELOG.md's PR #2458 entry (ctx_008) describes as the fix.
      what_l1_fallback: false

    - id: ctx_005
      layer: what-l3
      source: "crates/printer/src/util.rs:452-471 (trim_ascii_prefix free function)"
      type: implementation
      confidence: EXTRACTED
      aspect_id: a1
      aspect: Trim flag definition and wiring
      summary: >
        The free function trims leading bytes matching `is_space()` (tab,
        LF, VT, FF, CR, space) via `take_while`, but explicitly excludes any
        byte that is part of the configured `line_term`
        (`!line_term.as_bytes().contains(&b)`) — so it never eats a CRLF
        `\r` that is itself the line terminator. This is a genuine,
        verified interaction point with the separate CRLF/line-terminator
        subsystem the ripgrep-crlf-replace-terminator case study covers
        (same file, util.rs), without overlapping its scope.
      what_l1_fallback: false

